name: Build
on: [push]

permissions:
  contents: read

env:
  CI_BUILD_NUM: ${{ github.run_id }}
  CI_BRANCH: ${{ github.ref_name }}

jobs:
  test:
    name: Test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - run: npm ci
      - name: Check release configuration and tooling
        run: npm run test-release
      - run: npm run test-ci
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    name: Release
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    runs-on: ubuntu-latest
    needs: test
    # Operator pause switch, not an authorization boundary. Environments still restrict refs.
    if: vars.RELEASE_ENABLED == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1.x')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - run: npm ci
      - name: Publish release
        run: |
          rm -f release-notes.md
          npm run semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # npm authenticates through OIDC for the protected release environment.