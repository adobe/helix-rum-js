name: Verify release-branch delivery
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # This writes only a unique prerelease-shaped canary, never a stable alias.
    if: github.ref == 'refs/heads/main'
    environment: release
    permissions:
      contents: read # release-* writes use the publisher App token below
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint a release-branch token
        # Short-lived installation token for helix-rum-release-publisher, the only
        # identity allowed to write release-* branches. Key lives in this environment.
        id: publisher
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.publisher.outputs.token }}
          persist-credentials: true
      - name: Push a canary and verify AEM Code Sync delivery
        run: |
          version="0.0.0-auth.$GITHUB_RUN_ID"
          branch="release-0-0-0-auth-$GITHUB_RUN_ID"
          probe="test/release-auth-$GITHUB_RUN_ID.json"
          received=$(mktemp)
          trap 'rm -f "$probe" "$received"' EXIT
          printf '{"source":"%s","run":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$probe"
          ./tagger.sh "$version" "$probe" --push
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          url="https://$branch--$repo--$owner.aem.live/$probe"
          curl --proto '=https' --proto-redir '=https' --fail --location \
            --retry 6 --retry-all-errors --retry-delay 5 --retry-max-time 120 \
            --max-time 20 --output "$received" "$url"
          cmp "$probe" "$received"
          echo "Verified release-branch delivery: $url"
          echo 'The canary branch is retained; no stable alias or npm release was changed.'
