name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork PRs cannot mint the OIDC token the action exchanges for its GitHub
    # App token, so skip them rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      AWS_REGION: us-west-2
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      # Claude Code's default Bedrock small/fast model (claude-3-5-haiku) is
      # end-of-life and returns 404, so pin a current one.
      ANTHROPIC_SMALL_FAST_MODEL: us.anthropic.claude-haiku-4-5-20251001-v1:0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          allowed_bots: "renovate"

          # Post a tracking comment and update it with the review. Without this
          # the action runs in agent mode and Claude's output goes nowhere.
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.

            Anchor every specific finding to its line with
            mcp__github_inline_comment__create_inline_comment. This overrides
            the "never create new comments" rule above: inline review comments
            are expected here and do not count as new comments. Keep only
            cross-cutting observations and the overall verdict in your tracking
            comment, and do not repeat there what you already said inline.

          # No `gh` grants. `gh pr comment --body "$AWS_BEARER_TOKEN_BEDROCK"`
          # would publish the Bedrock credential to a public PR, and `gh --jq`
          # can read the environment. The inline-comment MCP tool takes
          # structured arguments and cannot interpolate env vars; `git diff`
          # and `git log` read local state and cannot publish.
          #
          # tag mode grants git add/commit/rm/push by default so Claude can
          # implement fixes. This workflow only reviews, and `git commit -m
          # "$AWS_BEARER_TOKEN_BEDROCK"` followed by a push would leak the
          # credential the same way `gh pr comment` would, so deny them. Deny
          # rules win over allow rules.
          #
          # npm is allowed so the review can check its claims against a real
          # lint and test run. Note this executes package scripts from the PR
          # head: the action restores .claude, CLAUDE.md and .husky from base
          # as untrusted, but not package.json. Narrowing the grant does not
          # change that, since the PR author defines what `lint` and `test`
          # run. Same-repo PRs only (fork guard above), so this is bounded by
          # push access, and the Bedrock account is staging.
          claude_args: |
            --model us.anthropic.claude-opus-4-8
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(npm ci:*),Bash(npm run lint:*),Bash(npm test:*),Read,Glob,Grep"
            --disallowedTools "Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Write,Edit"
